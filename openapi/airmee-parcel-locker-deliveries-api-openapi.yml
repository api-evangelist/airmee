        url: /get_parcel_locker_details/:parcel_locker_ids
components:
  schemas:
    Error:
      type: object
      description: Error envelope returned on 4xx/5xx responses.
      properties:
        message:
          type: string
          description: Short error message
        extraMessage:
          type: string
          description: Additional detail on the failure
      required:
      - message
  securitySchemes:
    jwtAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Pickup place's long-lived JWT issued by Airmee, sent as the raw value of the Authorization header (the published curl examples use `Authorization:<YOUR_JWT>` with no scheme prefix).
externalDocs:
  description: Airmee Integration API documentation (apidoc site)
  url: http://integration.docs.airmee.com.s3-website-eu-west-1.amazonaws.com/
