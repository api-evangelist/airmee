  /delivery_intervals_for_zip_code:
    get:
      operationId: deliveryIntervals
      summary: Delivery intervals for TA
      description: Call this API endpoint if you want to get the availability based on zip code and country. This method queries
        the server and returns a list of available delivery times. This endpoint is mainly used by TA-systems to validate
        that the selected delivery time by the customer is still available prior to invoking a booking request.
      tags:
      - Home Deliveries
      parameters:
      - name: zip_code
        in: query
        required: true
        description: The zip code of the region that you want to check
        schema:
          type: string
      - name: country
        in: query
        required: true
        description: The country that the zip code belongs to, as declared via the ISO Alpha-2 Code - https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2
        schema:
          type: string
      - name: place_id
        in: query
        required: true
        description: Id of the pickup place from where the request originates
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  list_of_schedules:
                    type: array
                    items:
                      type: object
                      properties:
                        pickup_interval:
                          type: object
                          description: An object representing the pickup interval
                          properties:
                            start:
                              type: integer
                              format: int64
                              description: Unix timestamp for the earliest pickup possible time associated with the interval
                            end:
                              type: integer
                              format: int64
                              description: Unix timestamp for the latest pickup possible time associated with the interval
                            formatted_as_schedule:
                              type: string
                              description: the human readable delivery time window when the delivery can be picked up from
                                the specified place
                          required:
                          - start
                          - end
                          - formatted_as_schedule
                        dropoff_interval:
                          type: object
                          description: An object representing the dropoff interval
                          properties:
                            start:
                              type: integer
                              format: int64
                              description: Unix timestamp for the earliest dropoff possible time associated with the interval
                            end:
                              type: integer
                              format: int64
                              description: Unix timestamp for the latest dropoff possible time associated with the interval
                            formatted_as_schedule:
                              type: string
                              description: the human readable delivery time window when the delivery can be dropped off to
                                the recipient
                          required:
                          - start
                          - end
                          - formatted_as_schedule
                      required:
                      - pickup_interval
                      - dropoff_interval
                    description: the preformatted available list of schedules for the given place id and zip code pairs as
                      a JSON Array (see below for object attributes)
                required:
                - list_of_schedules
              example:
                list_of_schedules:
                - pickup_interval:
                    start: '1613631600'
                    end: '1613646000'
                    formatted_as_schedule: (Idag) 08:00 -12:00
                    interval_category: Interval
                  dropoff_interval:
                    interval_category: Interval
                    start: '1613664000'
                    end: '1613682000'
                    formatted_as_schedule: (Idag) 17:00-22:00
                  extras: {}
                - pickup_interval:
                    start: '1613718000'
                    end: '1613732400'
                    formatted_as_schedule: (Imorgon) 08:00-12:00
                    interval_category: Interval
                  dropoff_interval:
                    interval_category: Interval
                    start: '1613750400'
                    end: '1613768400'
                    formatted_as_schedule: (Imorgon) 17:00-22:00
                  extras: {}
        '400':
          description: 'ValidationError: The request does not contain all the needed parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ValidationError:
                  summary: The request does not contain all the needed parameters
                  value:
                    message: Invalid inputs supplied
                    extraMessage: <Required Param> is required
        '401':
          description: 'Unauthorized — the Authorization header is missing or the JWT is not valid (observed live on api.airmee.com
            2026-09-19: `{"message":"Unauthorized"}`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
