format_note: 'Airmee does not use RFC 9457 application/problem+json. Every documented failure body is a plain application/json
  object with `message` and `extraMessage` (the apidoc error examples), and the AWS API Gateway edge answers unmatched
  or unauthenticated requests with a one-field {"message": ...} body (observed live: 401 {"message":"Unauthorized"}
  on a documented route without a JWT; 403 {"message":"Forbidden"} on any unmatched route; 403 {"message":"Missing
  Authentication Token"} on GET of a POST-only route). Errors are named in the docs by class (ValidationError, NotFoundError,
  GeocodeError, DatabaseConnectionError) rather than by a machine-readable code field, so an agent must branch on
  HTTP status and message text.'
