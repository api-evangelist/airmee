  /service_area_availability_for_zip_code:
    get:
      operationId: serviceAreaAvailability
      summary: Service area availabilty
      description: This request can take two different sets of parameters. When invoked with an address the city parameter will be required. The pair together with the optional country which defaults to "SE" will be geocoded. The set of coordinates will then be used to verify whether Airmee delivers for the specified store (via place id) at that address. When invoked without an address the zip code together with country will be used to determine service availability
      tags:
      - Home Deliveries
      parameters:
      - name: place_id
        in: query
        required: true
        description: An id that identifies a specific store
        schema:
          type: string
      - name: zip_code
        in: query
        required: true
        description: The zip code that is to be checked for store availability
        schema:
          type: string
      - name: country
        in: query
        required: true
        description: The 2-letter ISO country-code of the country
        schema:
          type: string
      - name: street_and_number
        in: query
        required: false
        description: The street address. When this param is present then City will be required and not optional
        schema:
          type: string
      - name: city
        in: query
        required: false
        description: The name of the city for the address
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  inside_service_area:
                    type: boolean
                    description: A Boolean stating if the given store is within the service area or not
                required:
                - inside_service_area
              example:
                inside_service_area: true
        '400':
          description: 'ValidationError: The request does not contain all the needed parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ValidationError:
                  summary: The request does not contain all the needed parameters
                  value:
                    message: Invalid inputs supplied
                    extraMessage: <Required Param> is required
        '401':
          description: 'Unauthorized — the Authorization header is missing or the JWT is not valid (observed live on api.airmee.com 2026-09-19: `{"message":"Unauthorized"}`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: 'GeocodeError: Failed to geocode address'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                GeocodeError:
                  summary: Failed to geocode address
                  value:
                    message: Geocoding error
                    extraMessage: 'Address could not be found: <address>'
        '500':
          description: 'DatabaseConnectionError: Failed to retrieve the service area availability for the store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                DatabaseConnectionError:
                  summary: Failed to retrieve the service area availability for the store
                  value:
                    message: Database connection error
                    extraMessage: Failed to retrieve the service area availability for the store
