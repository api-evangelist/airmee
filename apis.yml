aid: airmee
name: Airmee
description: Airmee is a Stockholm-based last-mile delivery company (founded 2018 by Julian Lee and Adrian Prelipcean)
  that runs same-day and next-day home delivery, outdoor parcel-locker delivery and label-less returns for e-commerce
  retailers across Sweden — Amazon, Apotea, Adlibris, Acne Studios, Sellpy and Meds among them — on a proprietary
  Smart Logistics Platform that route-optimises deliveries in real time and reports 99%+ fossil-free transport. Retailers
  and transport-administration (TA) systems integrate through the Airmee Integration API on api.airmee.com, a JWT-authenticated
  REST surface that quotes delivery intervals for a zip code at checkout, checks service-area availability and parcel
  size thresholds, lists nearby collection points and parcel lockers, books home / locker / collection-point deliveries
  and returns, and cancels a booking before pickup. A first-party PHP SDK and Magento 2 module are on Packagist, and
  partner-built WooCommerce and Shopify connectors exist.
