  /checkout_delivery_intervals_for_zip_code:
    get:
      operationId: deliveryIntervalsForCheckout
      summary: Delivery intervals for checkout
      description: Call this API endpoint if you want to get the availability based on zip code and country with customer
        specific cut off times for checkout. This method queries the server and returns a list of available delivery times
        that the customer can choose from. In case a delivery time cannot be allocated because of the address, the endpoint
        will reply with an empty list. An offset should be provided with the "date" parameter. This offset denotes the estimated
        time it takes between this request is being made at checkout until the order is ready to be booked. Most commonly
        an order is ready to be booked when it has been packed.
      tags:
      - Home Deliveries
      parameters:
      - name: zip_code
        in: query
        required: true
        description: The zip code of the region that you want to check
        schema:
          type: string
      - name: country
        in: query
        required: true
        description: The country that the zip code belongs to, as declared via the ISO Alpha-2 Code - https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2
        schema:
          type: string
      - name: place_id
        in: query
        required: true
        description: Id of the pickup place from where the request originates
        schema:
          type: string
          format: uuid
      - name: date
        in: query
        required: false
        description: The offset time (I.e. 2020-01-01 10:00:00) in time zone 'Europe/Stockholm' for earliest available delivery
          windows. If it takes 2h from customer checkout until the orders is ready to be delivered, then set the offset to
          current time + 2 hours. This can also be used in case the customer wants a delivery date further than one week into
          the future (which is the default Airmee delivery window response)
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  list_of_schedules:
                    type: array
                    items:
                      type: object
                      properties:
                        pickup_interval:
                          type: object
                          description: An object representing the pickup interval
                          properties:
                            start:
                              type: integer
                              format: int64
                              description: Unix timestamp for the earliest pickup possible time associated with the interval
                            end:
                              type: integer
                              format: int64
                              description: Unix timestamp for the latest pickup possible time associated with the interval
                            formatted_as_schedule:
                              type: string
                              description: the human readable delivery time window when the delivery can be picked up from
                                the specified place
                            interval_category:
                              type: string
                              description: can either be "Interval" stating a regular delivery withing a time interval or
                                "Express " stating an express delivery withing x hour(s)
                          required:
                          - start
                          - end
                          - formatted_as_schedule
                          - interval_category
                        dropoff_interval:
                          type: object
                          description: An object representing the dropoff interval
                          properties:
                            start:
                              type: integer
                              format: int64
                              description: Unix timestamp for the earliest dropoff possible time associated with the interval
                            end:
                              type: integer
                              format: int64
                              description: Unix timestamp for the latest dropoff possible time associated with the interval
                            formatted_as_schedule:
                              type: string
                              description: the human readable delivery time window when the delivery can be dropped off to
                                the recipient
                            interval_category:
                              type: string
                              description: can either be "Interval" stating a regular delivery withing a time interval or
                                "Express " stating an express delivery withing x hour(s)
                          required:
                          - start
                          - end
                          - formatted_as_schedule
                          - interval_category
                        extras:
                          type: object
                          description: An object containing extra information about the time interval
                          properties:
                            is_green:
                              type: boolean
                              description: A boolean representing eco-delivery
                          required:
                          - is_green
                      required:
                      - pickup_interval
                      - dropoff_interval
                      - extras
                    description: the preformatted available list of schedules for the given place id and zip code pairs as
                      a JSON Array (see below for object attributes)
                required:
                - list_of_schedules
              example:
                list_of_schedules:
                - pickup_interval:
                    start: '1613631600'
                    end: '1613646000'
                    formatted_as_schedule: (Idag) 08:00 -12:00
                    interval_category: Interval
                  dropoff_interval:
                    interval_category: Interval
                    start: '1613664000'
                    end: '1613682000'
                    formatted_as_schedule: (Idag) 17:00-22:00
                  extras:
                    is_green: true
                - pickup_interval:
                    start: '1613718000'
                    end: '1613732400'
                    formatted_as_schedule: (Imorgon) 08:00-12:00
                    interval_category: Interval
                  dropoff_interval:
                    interval_category: Interval
                    start: '1613750400'
                    end: '1613768400'
                    formatted_as_schedule: (Imorgon) 17:00-22:00
                  extras:
                    is_green: true
        '400':
          description: 'ValidationError: The request does not contain all the needed parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ValidationError:
                  summary: The request does not contain all the needed parameters
                  value:
                    message: Invalid inputs supplied
                    extraMessage: <Required Param> is required
        '401':
          description: 'Unauthorized — the Authorization header is missing or the JWT is not valid (observed live on api.airmee.com
            2026-09-19: `{"message":"Unauthorized"}`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
