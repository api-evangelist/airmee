  /get_parcel_locker_details:
    get:
      operationId: parcelLockerDetails
      summary: Parcel locker details
      description: Call this API endpoint if you want to get the details of a parcel locker by passing parcel locker id(s).
        This method queries the server and returns a list of parcel lockers with details like name, address, coordinates and
        operating hours.
      tags:
      - Parcel Locker Deliveries
      parameters:
      - name: parcel_locker_ids
        in: query
        required: true
        description: The parcel locker id(s)
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  parcel_locker_details:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Name of the parcel locker
                        address_details:
                          type: object
                          description: An object representing the address of parcel locker
                          properties:
                            street_and_number:
                              type: string
                              description: Street name and street number of the parcel locker
                            city:
                              type: string
                              description: City of the parcel locker
                            country:
                              type: string
                              description: Country of the parcel locker
                            zip_code:
                              type: string
                              description: Zip code of the parcel locker
                            country_code:
                              type: string
                              description: ISO country code of the parcel locker
                            coordinates:
                              type: object
                              description: An object representing coordinates of the parcel locker
                              properties:
                                latitude:
                                  type: number
                                  format: double
                                  description: Latitude of parcel locker
                                longitude:
                                  type: number
                                  format: double
                                  description: Longitude of parcel locker
                              required:
                              - latitude
                              - longitude
                          required:
                          - street_and_number
                          - city
                          - country
                          - zip_code
                          - country_code
                          - coordinates
                        operating_hours:
                          type: object
                          description: An object representing the parcel locker operating hours
                          properties:
                            day_of_week:
                              type: integer
                              description: Number representation for day of week
                            open_all_day:
                              type: string
                              description: Boolean representation if locker is open or closed. If true, then open else closed
                          required:
                          - day_of_week
                          - open_all_day
                      required:
                      - name
                      - address_details
                      - operating_hours
                    description: the preformatted details of a locker for the given locker id or list of locker ids as a JSON
                      Array (see below for object attributes)
                required:
