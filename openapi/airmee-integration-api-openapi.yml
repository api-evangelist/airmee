                  - day_of_week: 1
                    open_all_day: true
                  - day_of_week: 2
                    open_all_day: true
                  - day_of_week: 3
                    open_all_day: true
                  - day_of_week: 4
                    open_all_day: true
                  - day_of_week: 5
                    open_all_day: true
                  - day_of_week: 6
