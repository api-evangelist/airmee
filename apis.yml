  description: The Airmee Integration API (apidoc version 0.3.0) — 12 operations for e-commerce and TA-system integrations
    to quote delivery and return intervals for a zip code, check service-area availability and product size/weight
    thresholds, list nearby collection points and parcel lockers, book home, collection-point and parcel-locker deliveries
    and returns, and cancel a delivery before pickup. Authenticated with a long-lived JWT issued per pickup place.
