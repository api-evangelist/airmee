  /get_parcel_lockers_for_zip_code:
    get:
      operationId: getParcelLockersForZipCode
      summary: Parcel locker delivery intervals
      description: Call this API endpoint if you want to get the details and availability of parcel locker based on zip code and country up to a given limit. This method queries the server and returns a list of available delivery times. This endpoint is mainly used by TA-systems to validate that the selected delivery time by the customer is still available prior to invoking a booking request.
      tags:
      - Parcel Locker Deliveries
      parameters:
      - name: zip_code
        in: query
        required: true
        description: The zip code of the region that you want to check
        schema:
          type: string
      - name: country
        in: query
        required: true
        description: The country code that zip code belongs to, as declared via the ISO Alpha-2 Code - https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: The number of closest parcel lockers to retrieve
        schema:
          type: integer
      - name: place_id
        in: query
        required: true
        description: Id of the pickup place from where the request originates
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  list_of_parcel_lockers:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Name of the locker
                        address_details:
                          type: object
                          description: An object representing the address of parcel locker
                          properties:
                            street_and_number:
                              type: string
                              description: Street name and street number of the parcel locker
                            city:
                              type: string
                              description: City of the parcel locker
                            country:
                              type: string
                              description: Country of the parcel locker
                            zip_code:
                              type: string
                              description: Zip code of the parcel locker
                            country_code:
                              type: string
                              description: ISO country code of the parcel locker
                            coordinates:
                              type: object
                              description: An object representing coordinates of the parcel locker
                              properties:
                                latitude:
                                  type: number
                                  format: double
                                  description: Latitude of parcel locker
                                longitude:
                                  type: number
                                  format: double
                                  description: Longitude of parcel locker
                              required:
                              - latitude
                              - longitude
                          required:
                          - street_and_number
                          - city
                          - country
                          - zip_code
                          - country_code
                          - coordinates
                        distance:
                          type: integer
                          description: Approx. distance from the parcel locker
                        operating_hours:
                          type: object
                          description: An object representing the parcel locker operating hours
                          properties:
                            day_of_week:
                              type: integer
                              description: Number representation for day of week
                            open_all_day:
                              type: string
                              description: Boolean representation if locker is open or closed. If true, then open else closed
                          required:
                          - day_of_week
                          - open_all_day
                        pickup_interval:
                          type: object
                          description: An object representing the pickup interval
                          properties:
                            start:
                              type: integer
                              format: int64
                              description: Unix timestamp for the earliest pickup possible time associated with the interval
                            end:
                              type: integer
                              format: int64
                              description: Unix timestamp for the latest pickup possible time associated with the interval
                            formatted_as_schedule:
                              type: string
                              description: the human readable delivery time window when the delivery can be picked up from the specified place
                          required:
                          - start
                          - end
                          - formatted_as_schedule
                        dropoff_interval:
                          type: object
                          description: An object representing the dropoff interval
                          properties:
                            start:
                              type: integer
                              format: int64
                              description: Unix timestamp for the earliest dropoff possible time associated with the interval
                            end:
                              type: integer
                              format: int64
                              description: Unix timestamp for the latest dropoff possible time associated with the interval
                            formatted_as_schedule:
                              type: string
                              description: the human readable delivery time window when the delivery can be dropped off to the recipient
                            eta:
                              type: integer
                              format: int64
                              description: Unix timestamp for the ETA associated with the interval
                            eta_formatted:
                              type: string
                              description: the human readable delivery ETA when the delivery can be dropped off to the recipient
                          required:
                          - start
                          - end
                          - formatted_as_schedule
                          - eta
                          - eta_formatted
                        extras:
                          type: object
                          description: An object containing extra information about the delivery interval
                      required:
                      - name
                      - address_details
                      - distance
                      - operating_hours
                      - pickup_interval
                      - dropoff_interval
                      - extras
                    description: the preformatted available list of parcel locker schedules for the given place id and zip code pairs as a JSON Array (see below for object attributes)
                required:
                - list_of_parcel_lockers
        '400':
          description: 'ValidationError: The request does not contain all the needed parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ValidationError:
                  summary: The request does not contain all the needed parameters
                  value:
                    message: Invalid inputs supplied
                    extraMessage: <Required Param> is required
        '401':
          description: 'Unauthorized — the Authorization header is missing or the JWT is not valid (observed live on api.airmee.com 2026-09-19: `{"message":"Unauthorized"}`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'DatabaseConnectionError: Fail to retrieve the parcel lockers for the zip code'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                DatabaseConnectionError:
                  summary: Fail to retrieve the parcel lockers for the zip code
                  value:
                    message: Database connection error
                    extraMessage: Fail to retrieve the parcel lockers for the zip code
      x-apidoc:
        group: Parcel_locker_deliveries
        name: get_parcel_lockers_for_zip_code
        title: 2. Parcel locker delivery intervals
        version: 0.3.0
        url: /get_parcel_lockers_for_zip_code/:zip_code&:country&:place_id&:limit
  /get_parcel_locker_details:
    get:
      operationId: parcelLockerDetails
      summary: Parcel locker details
      description: Call this API endpoint if you want to get the details of a parcel locker by passing parcel locker id(s). This method queries the server and returns a list of parcel lockers with details like name, address, coordinates and operating hours.
      tags:
      - Parcel Locker Deliveries
      parameters:
      - name: parcel_locker_ids
        in: query
        required: true
        description: The parcel locker id(s)
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  parcel_locker_details:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Name of the parcel locker
                        address_details:
                          type: object
                          description: An object representing the address of parcel locker
                          properties:
                            street_and_number:
                              type: string
                              description: Street name and street number of the parcel locker
                            city:
                              type: string
                              description: City of the parcel locker
                            country:
                              type: string
                              description: Country of the parcel locker
                            zip_code:
                              type: string
                              description: Zip code of the parcel locker
                            country_code:
                              type: string
                              description: ISO country code of the parcel locker
                            coordinates:
                              type: object
                              description: An object representing coordinates of the parcel locker
                              properties:
                                latitude:
                                  type: number
                                  format: double
                                  description: Latitude of parcel locker
                                longitude:
                                  type: number
                                  format: double
                                  description: Longitude of parcel locker
                              required:
                              - latitude
                              - longitude
                          required:
                          - street_and_number
                          - city
                          - country
                          - zip_code
                          - country_code
                          - coordinates
                        operating_hours:
                          type: object
                          description: An object representing the parcel locker operating hours
                          properties:
                            day_of_week:
                              type: integer
                              description: Number representation for day of week
                            open_all_day:
                              type: string
                              description: Boolean representation if locker is open or closed. If true, then open else closed
                          required:
                          - day_of_week
                          - open_all_day
                      required:
                      - name
                      - address_details
                      - operating_hours
                    description: the preformatted details of a locker for the given locker id or list of locker ids as a JSON Array (see below for object attributes)
                required:
                - parcel_locker_details
              example:
                parcel_locker_details:
                - id: locker_id_1
                  name: locker_name_1
                  operating_hours:
                  - day_of_week: 0
                    open_all_day: true
                  - day_of_week: 1
                    open_all_day: true
                  - day_of_week: 2
                    open_all_day: true
                  - day_of_week: 3
                    open_all_day: true
                  - day_of_week: 4
                    open_all_day: true
                  - day_of_week: 5
                    open_all_day: true
                  - day_of_week: 6
                    open_all_day: true
                  address_details:
                    street_and_number: street_and_number 1
                    city: Stockholm
                    zip_code: '11359'
                    country_code: SE
                    country: Sweden
                    coordinates:
                      latitude: 59.339963
                      longitude: 18.060152
                - id: locker_id_2
                  name: locker_name_2
                  operating_hours:
                  - day_of_week: 0
                    open_all_day: true
                  - day_of_week: 1
                    open_all_day: true
                  - day_of_week: 2
                    open_all_day: true
                  - day_of_week: 3
                    open_all_day: true
                  - day_of_week: 4
                    open_all_day: true
                  - day_of_week: 5
                    open_all_day: true
                  - day_of_week: 6
                    open_all_day: true
                  address_details:
                    street_and_number: street_and_number 2
                    city: Stockholm
                    zip_code: '11120'
                    country_code: SE
                    country: Sweden
                    coordinates:
                      latitude: 59.339983
                      longitude: 18.060252
        '400':
          description: 'ValidationError: The request does not contain all the needed parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ValidationError:
                  summary: The request does not contain all the needed parameters
                  value:
                    message: Invalid inputs supplied
                    extraMessage: <Required Param> is required
        '401':
          description: 'Unauthorized — the Authorization header is missing or the JWT is not valid (observed live on api.airmee.com 2026-09-19: `{"message":"Unauthorized"}`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'DatabaseConnectionError: Fail to retrieve the parcel locker data'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                DatabaseConnectionError:
                  summary: Fail to retrieve the parcel locker data
                  value:
                    message: Database connection error
                    extraMessage: Fail to retrieve the parcel locker data
