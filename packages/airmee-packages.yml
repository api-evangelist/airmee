note: Airmee publishes two first-party packages, both on Packagist and both sourced from the bitbucket.org/airmeedevs
  workspace, and both frozen at 1.0.0 since April 2017 — five and a half years before the apidoc contract they wrap
  was last regenerated (api_data.json generator time 2022-11-02), which is a strong abandonment signal. The php-sdk
  README itself says "Everything in this file is subject to change as we evolve the SDK" and reads as a design sketch
  (proposed classes, open questions) rather than a finished client; it is the artifact that points at the integration
  docs URL, which is how ownership of the S3 docs bucket was confirmed. A third-party fork (pigmentab/airmee-php-sdk,
  Pigment AB) carried the SDK forward to 1.2.1 in May 2022 and is recorded as unofficial. No npm, PyPI, RubyGems,
  NuGet, crates.io or Go module exists; the ZentaSE/airmee.NET C# repository on GitHub (last push 2019-02-11) and
  alvesvaren/homeassistant-airmee are community projects and are not recorded as packages.
