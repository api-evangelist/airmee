components:
  securitySchemes:
    jwtAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Pickup place's long-lived JWT issued by Airmee, sent as the raw value of the Authorization header (the
        published curl examples use `Authorization:<YOUR_JWT>` with no scheme prefix).
  schemas:
    Error:
      type: object
      description: Error envelope returned on 4xx/5xx responses.
      properties:
        message:
          type: string
          description: Short error message
        extraMessage:
          type: string
          description: Additional detail on the failure
      required:
      - message
